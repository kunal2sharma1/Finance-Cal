name: Verify watchdog

on:
  schedule:
    # GitHub's minimum supported schedule is 5 minutes. Keep this as a fallback;
    # normal push events on Verify build remain the primary path.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ensure-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check current HEAD and verification state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: fincalc-generational-release
          VERIFY_WORKFLOW: verify-build.yml
        run: |
          set -euo pipefail

          branch_json="$(gh api "repos/${REPO}/branches/${BRANCH}")"
          head_sha="$(jq -r '.commit.sha' <<<"${branch_json}")"

          runs_json="$(gh api "repos/${REPO}/actions/workflows/${VERIFY_WORKFLOW}/runs?branch=${BRANCH}&per_page=20")"

          # A run for this exact HEAD that is still queued/in progress means
          # verification is already underway. Do nothing.
          active_count="$(jq --arg sha "${head_sha}" '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress"))] | length' <<<"${runs_json}")"
          if [ "${active_count}" -gt 0 ]; then
            echo "Verify already running for ${head_sha}."
            exit 0
          fi

          # A completed run for this exact HEAD is authoritative, regardless of
          # whether it passed or failed. A failed run needs a code/config change,
          # not an infinite watchdog retry loop.
          completed_count="$(jq --arg sha "${head_sha}" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed")] | length' <<<"${runs_json}")"
          if [ "${completed_count}" -gt 0 ]; then
            conclusion="$(jq -r --arg sha "${head_sha}" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed")] | sort_by(.updated_at) | last | .conclusion' <<<"${runs_json}")"
            echo "Verify already completed for ${head_sha}: ${conclusion}."
            exit 0
          fi

          echo "No Verify run exists for ${head_sha}; dispatching Verify build."
          gh workflow run "${VERIFY_WORKFLOW}" --repo "${REPO}" --ref "${BRANCH}"
          echo "Verify build dispatched for ${head_sha}."
