name: Verify watchdog

on:
  schedule:
    # Scheduled workflows execute from the repository default branch.
    # The watchdog targets the release branch explicitly below.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: verify-watchdog
  cancel-in-progress: false

jobs:
  ensure-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch release-branch gate when needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: fincalc-generational-release
          RELEASE_WORKFLOW: release-watchdog.yml
          VERIFY_WORKFLOW: verify-build.yml
        run: |
          set -euo pipefail

          head_sha="$(gh api "repos/${REPO}/branches/${BRANCH}" --jq '.commit.sha')"
          if gh api -s "repos/${REPO}/contents/.security-remediation-pending?ref=${BRANCH}" >/dev/null 2>&1; then
            echo "Security remediation pending for ${head_sha}; dispatching release gate."
            gh workflow run "${RELEASE_WORKFLOW}" --repo "${REPO}" --ref "${BRANCH}"
            exit 0
          fi

          runs_json="$(gh api "repos/${REPO}/actions/workflows/${VERIFY_WORKFLOW}/runs?branch=${BRANCH}&per_page=30")"
          active_count="$(jq --arg sha "$head_sha" '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress"))] | length' <<<"$runs_json")"
          completed_count="$(jq --arg sha "$head_sha" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed")] | length' <<<"$runs_json")"

          if [ "$active_count" -gt 0 ] || [ "$completed_count" -gt 0 ]; then
            echo "Release HEAD $head_sha already has an active or completed Verify run."
            exit 0
          fi

          echo "No Verify run exists for release HEAD $head_sha; dispatching release gate."
          gh workflow run "${RELEASE_WORKFLOW}" --repo "${REPO}" --ref "${BRANCH}"
