name: Verify build

on:
  push:
    branches: [main, seo-development]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'scripts/**'
  workflow_dispatch:

env:
  VERIFY_RUN: "2026-08-16T11:37:17+05:30"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate SEO configuration
        run: npm run seo:check

      - name: Build
        run: npm run build
