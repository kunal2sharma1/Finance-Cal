name: Verify build

on:
  push:
    branches: [main, seo-development, global-development, seo-growth-v1]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'scripts/**'
  workflow_dispatch:

env:
  VERIFY_RUN: "2026-08-16T16:01:27+05:30"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate SEO Growth V1
        run: npm run seo:growth:v1

      - name: Validate country SEO
        run: npm run country-seo:check

      - name: Validate search intent SEO
        run: npm run seo-intent:check

      - name: Validate technical SEO
        run: npm run technical-seo:check

      - name: Validate internal link coverage
        run: npm run internal-links:check

      - name: Validate SERP metadata quality
        run: npm run serp:check

      - name: Validate SEO configuration
        run: npm run seo:check

      - name: Run formula regression tests
        run: npm run formula:check

      - name: Build
        run: npm run build
