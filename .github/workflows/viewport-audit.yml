name: Multi-viewport calculator audit

on:
  push:
    branches: [fincalc-generational-release]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'playwright.config.mjs'
      - 'scripts/viewport-audit/**'
      - 'scripts/publish-ci-status.mjs'
      - '.github/workflows/viewport-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  viewport-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.1

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run multi-viewport calculator audit
        run: npx --no-install playwright test

      - name: Publish CI status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_FILE: ci-status/viewport.json
          STATUS_BRANCH: ci-status
          WORKFLOW_NAME: Multi-viewport calculator audit
          JOB_STATUS: ${{ job.status }}
        run: node scripts/publish-ci-status.mjs
