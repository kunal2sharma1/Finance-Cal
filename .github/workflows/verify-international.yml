name: Verify international build

on:
  push:
    branches: [global-development]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/verify-international.yml'
  workflow_dispatch:

jobs:
  international:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate international calculators
        run: node scripts/international-check.mjs

      - name: Validate SEO configuration
        run: npm run seo:check

      - name: Run formula regression tests
        run: npm run formula:check

      - name: Build
        run: npm run build
