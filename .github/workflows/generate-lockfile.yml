name: Generate package lockfile

on:
  push:
    branches: [main]
    paths:
      - 'src/package.json'
      - 'src/package-lock.json'
      - '.github/workflows/generate-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package.json

      - name: Generate lockfile
        working-directory: src
        run: npm install --package-lock-only

      - name: Commit lockfile
        run: |
          if git diff --quiet -- src/package-lock.json; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/package-lock.json
          git commit -m "Generate valid src package lockfile"
          git push
