name: Generate package lockfile

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generate-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate root lockfile
        run: npm install --package-lock-only

      - name: Commit lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet -- package-lock.json; then
            echo "Root lockfile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate root package lockfile for Vite 6"
          git push
